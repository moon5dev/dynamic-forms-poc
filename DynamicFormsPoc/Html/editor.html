<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Forms Editor</title>
  <link rel="stylesheet" href="vendor/summernote/summernote-lite.min.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="dynamic-toolbar" class="editor-toolbar" role="toolbar" aria-label="Dynamic form commands">
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertTable()">표+</button>
    <button type="button" data-design-only="true" onclick="window.editor.addTableRow()">행+</button>
    <button type="button" data-design-only="true" onclick="window.editor.deleteTableRow()">행-</button>
    <button type="button" data-design-only="true" onclick="window.editor.addTableColumn()">열+</button>
    <button type="button" data-design-only="true" onclick="window.editor.deleteTableColumn()">열-</button>
    <button type="button" data-design-only="true" onclick="window.editor.mergeCell()">병합</button>
    <button type="button" data-design-only="true" onclick="window.editor.splitCell()">분할</button>
    <button type="button" data-design-only="true" onclick="window.editor.toggleHeaderCell()">헤더</button>
    <button type="button" data-design-only="true" onclick="window.editor.setCellSize()">셀크기</button>
    <label class="toolbar-color-label" data-design-only="true">셀색 <input type="color" value="#dfeef3" onchange="window.editor.setCellBackground(this.value)" /></label>
    <span class="toolbar-separator"></span>
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertTextField()">텍스트</button>
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertNumberField()">숫자</button>
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertSelectField()">콤보</button>
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertCheckboxField()">체크</button>
    <button type="button" data-design-only="true" onclick="window.editor.promptInsertImageField()">이미지</button>
    <span class="fill-format-tools">
      <button type="button" onclick="window.editor.execCommand('bold')">B</button>
      <button type="button" onclick="window.editor.execCommand('italic')">I</button>
      <button type="button" onclick="window.editor.execCommand('underline')">U</button>
      <select title="글꼴" onchange="window.editor.execCommand('fontName', this.value)">
        <option value="Malgun Gothic">Malgun Gothic</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
      </select>
      <select title="크기" onchange="window.editor.execCommand('fontSize', this.value)">
        <option value="2">12</option>
        <option value="3" selected>14</option>
        <option value="4">18</option>
        <option value="5">22</option>
        <option value="6">28</option>
      </select>
      <input type="color" title="글자색" value="#222222" onchange="window.editor.execCommand('foreColor', this.value)" />
      <button type="button" onclick="window.editor.execCommand('justifyLeft')">왼쪽</button>
      <button type="button" onclick="window.editor.execCommand('justifyCenter')">가운데</button>
      <button type="button" onclick="window.editor.execCommand('justifyRight')">오른쪽</button>
    </span>
  </div>
  <div id="workspace">
    <div id="page" class="a4-page">
      <div id="document" class="document" contenteditable="true"></div>
    </div>
  </div>
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/summernote/summernote-lite.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
