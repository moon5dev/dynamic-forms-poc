<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Composition Preview</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body class="preview-body">
  <div id="previewRoot" class="preview-root"></div>
  <script src="editor.js"></script>
  <script>
    window.preview = {
      renderComposition: function (items) {
        var root = document.getElementById('previewRoot');
        root.innerHTML = '';
        items = items || [];
        for (var i = 0; i < items.length; i++) {
          var page = document.createElement('div');
          page.className = 'a4-page preview-page';
          var doc = document.createElement('div');
          doc.className = 'document';
          doc.innerHTML = items[i].Html || items[i].html || '';
          page.appendChild(doc);
          root.appendChild(page);
        }
        if (window.editor) {
          window.editor.prepareForPrint(root);
        }
      },
      printDocument: function () {
        if (window.editor) {
          window.editor.prepareForPrint(document.getElementById('previewRoot'));
        }
        window.print();
      }
    };
  </script>
</body>
</html>
